# ────────────────────────────────────────────────────────────
# Omarchy Windows 3 — Alacritty
# TypeSafe AI / Windows 3.1
# ────────────────────────────────────────────────────────────

[window]
padding.x = 16
padding.y = 16
decorations = "none"

[font]
size = 12.0

[colors.primary]
foreground = "#1e1e1e"
background = "#fefefe"

[colors.selection]
text = "#fefefe"
background = "#d45bb6"

[colors.cursor]
text = "#fefefe"
cursor = "#1e1e1e"

[colors.normal]
black   = "#1e1e1e"
red     = "#c45c78"
green   = "#03aa5c"
yellow  = "#c9a227"
blue    = "#000080"
magenta = "#d45bb6"
cyan    = "#09aea1"
white   = "#c0c0c0"

[colors.bright]
black   = "#858585"
red     = "#f386a1"
green   = "#14c46e"
yellow  = "#e0c04a"
blue    = "#1e1e9a"
magenta = "#e070c4"
cyan    = "#1bc4b6"
white   = "#1e1e1e"
