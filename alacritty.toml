# ────────────────────────────────────────────────────────────
# Omarchy Windows 3 — Alacritty
# Windows 3.1 VGA palette
# ────────────────────────────────────────────────────────────

[window]
padding.x = 16
padding.y = 16
decorations = "none"

[font]
size = 12.0

[colors.primary]
foreground = "#1e1e1e"
background = "#fefefe"

[colors.selection]
text = "#fefefe"
background = "#000080"

[colors.cursor]
text = "#fefefe"
cursor = "#000080"

[colors.normal]
black   = "#000000"
red     = "#800000"
green   = "#008000"
yellow  = "#808000"
blue    = "#000080"
magenta = "#800080"
cyan    = "#008080"
white   = "#c0c0c0"

[colors.bright]
black   = "#808080"
red     = "#ff0000"
green   = "#00ff00"
yellow  = "#ffff00"
blue    = "#0000ff"
magenta = "#ff00ff"
cyan    = "#00ffff"
white   = "#ffffff"
