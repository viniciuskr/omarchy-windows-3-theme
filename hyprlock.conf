# Windows 3 lock screen — TypeSafe pink desktop, Win31 password dialog.

background {
    monitor =
    path = screenshot
    blur_passes = 0
    color = rgb(255,128,192)
}

label {
    monitor =
    text = TS.AI.0S1
    color = rgb(30,30,30)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(30,30,30)
    font_size = 64
    font_family = JetBrains Mono
    position = 0, 200
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 44
    outline_thickness = 3
    dots_size = 0.35
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = 0
    outer_color = rgb(30,30,30)
    inner_color = rgb(192,192,192)
    font_color = rgb(30,30,30)
    fade_on_empty = false
    placeholder_text = <i>Enter Password</i>
    hide_input = false
    rounding = 0
    check_color = rgb(9,174,161)
    fail_color = rgb(196,92,120)
    fail_text = <i>$FAIL</i>
    position = 0, -40
    halign = center
    valign = center
}
