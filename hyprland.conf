# Windows 3 — Hyprland (legacy Omarchy / hyprland.conf overlay)
# Sharp Win31 chrome: no rounding, no blur, hard drop shadow.

general {
    layout = dwindle
    gaps_in = 6
    gaps_out = 10
    border_size = 3
    col.active_border = rgb(000080)
    col.inactive_border = rgb(808080)
}

decoration {
    rounding = 0
    dim_special = 0.2
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 1
        color = rgba(000000ff)
        offset = 3, 3
        ignore_window = true
    }

    blur {
        enabled = false
    }
}

group {
    col.border_active = rgb(000080)
    col.border_inactive = rgb(808080)
}

layerrule {
  name = layerrule-1
  ignore_alpha = 0.1
  match:namespace = notifications
}

gestures {
    gesture = 3, left, dispatcher, workspace, -1
    gesture = 3, right, dispatcher, workspace, +1
    gesture = 4, up, dispatcher, togglefloating
}
